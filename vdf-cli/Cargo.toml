[package]
name = "vdf-rs-cli"
version = "0.2.1"
readme = "README.md"
description = "Command-line interface for the vdf-rs Verifiable Delay Function crate"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/vdf-rs-cli"
keywords = ["vdf", "crypto", "cryptography", "classgroup", "cli"]
categories = ["cryptography", "command-line-utilities"]
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "vdf-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
vdf-classgroup = { path = "../vdf-classgroup", version = "0.2" }
vdf-rs = { path = "../vdf-rs", version = "0.2" }
hex = "0.4"
